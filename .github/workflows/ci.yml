name: Contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-dev.txt
      - run: genvm-lint download --version v0.2.16
      - run: genvm-lint check contracts/delta_bisect.py --json
      - run: python -m pytest -q
      - run: node scripts/check-scenarios.cjs
      - run: node --check scripts/live-proof.cjs && node --check scripts/verify-proofs.cjs
