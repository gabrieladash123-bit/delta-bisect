name: StudioNet Merkle disagreement proofs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delta-bisect-studionet
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned tooling
        run: |
          pip install -r requirements-dev.txt
          npm install --global genlayer@0.39.2
          genvm-lint download --version v0.2.16
      - name: Lint and direct tests
        run: |
          genvm-lint check contracts/delta_bisect.py --json
          python -m pytest -q --junitxml=proofs/cloud-direct-tests.xml
          node scripts/check-scenarios.cjs
      - name: Prepare encrypted disposable callers
        run: node scripts/bootstrap-ci.cjs
      - name: Deploy and resolve distinct disagreements
        run: node scripts/live-proof.cjs
      - name: Fresh receipts, sources, Merkle replay and state verification
        run: node scripts/verify-proofs.cjs
      - name: Upload sanitized receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studionet-proofs
          path: |
            proofs/*.json
            proofs/*.xml
          if-no-files-found: warn
